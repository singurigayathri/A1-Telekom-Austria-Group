name: Daily price update

on:
  schedule:
    - cron: "0 17 * * 1-5"       # every weekday 17:00 UTC, after European markets close
  workflow_dispatch: {}          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas
      - run: python fetch_prices.py
      - name: Save the new prices
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/benchmark_prices.json
          git diff --cached --quiet || (git commit -m "Daily price update" && git pull --rebase && git push)
